<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reset password · Hangmania</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #EEF2F8; color: #0B2C6B; padding: 16px; box-sizing: border-box; }
  .card { background: #fff; border-radius: 20px; padding: 32px 24px; max-width: 380px; width: 100%;
          text-align: center; box-shadow: 0 8px 30px rgba(11, 44, 107, .12); }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: #5A6B85; line-height: 1.5; margin: 0 0 22px; }
  .btn { display: inline-block; background: #0B2C6B; color: #fff; text-decoration: none; font-weight: 700;
         padding: 14px 26px; border-radius: 14px; font-size: 16px; }
  .error { color: #C0392B; }
  @media (prefers-color-scheme: dark) {
    body { background: #0E1F38; color: #F2EFE6; }
    .card { background: #1B3358; box-shadow: none; }
    p { color: #B8C4D8; }
    .btn { background: #E8B84B; color: #0B2C6B; }
  }
</style>
</head>
<body>
<!-- Supabase's password-reset email lands here (https, so in-app browsers like Gmail's load it)
     with the recovery token in the "#..." fragment. This page hands it to the app as
     hangman://reset-password#..., which App.xaml.cs opens the "new password" screen for.
     A tap on the button is the reliable path: many in-app browsers block an automatic jump
     to a custom scheme but allow one the user taps. -->
<div class="card">
  <h1 id="title">Reset your password</h1>
  <p id="text">Tap the button to open Hangmania and choose a new password.</p>
  <a id="open" class="btn" href="#">Open Hangmania</a>
</div>
<script>
  (function () {
    var ro = (navigator.language || "").toLowerCase().indexOf("ro") === 0;
    var params = (location.hash || location.search || "").replace(/^[#?]/, "");
    var error = /(^|&)error(_description)?=/.test(params);
    var title = document.getElementById("title");
    var text = document.getElementById("text");
    var button = document.getElementById("open");

    if (ro) {
      title.textContent = "Resetează parola";
      text.textContent = "Apasă butonul ca să deschizi Hangmania și să-ți alegi o parolă nouă.";
      button.textContent = "Deschide Hangmania";
    }

    if (error || params.indexOf("access_token=") === -1) {
      title.textContent = ro ? "Linkul nu mai e valabil" : "This link has expired";
      text.textContent = ro
        ? "Cere din aplicație un link nou de resetare a parolei."
        : "Request a new password-reset link from the app.";
      text.className = "error";
      button.style.display = "none";
      return;
    }

    var target = "hangman://reset-password#" + params;
    button.href = target;
    // Works in regular browsers; in-app ones fall back to the button.
    setTimeout(function () { location.href = target; }, 300);
  })();
</script>
</body>
</html>
