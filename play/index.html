<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<header class="bar">
  <a class="brand" href="#" id="brand"><img src="img/icon.png" alt="" width="32" height="32"><span>Hangmania</span></a>
  <div class="bar-right">
    <select id="lang" aria-label="Language"></select>
    <button class="acct" id="acct"></button>
  </div>
</header>

<main>
  <!-- Home -->
  <section id="home" class="view">
    <div class="hero">
      <h1>Hangmania</h1>
      <p id="tagline"></p>
    </div>

    <div class="player" id="player"></div>

    <div class="modes">
      <button class="mode classic" data-go="#classic">
        <span class="mode-ico">🎯</span>
        <span class="mode-txt"><b id="mClassic"></b><small id="mClassicDesc"></small></span>
      </button>
      <button class="mode killer" data-go="#killer">
        <span class="mode-ico">💀</span>
        <span class="mode-txt"><b id="mKiller"></b><small id="mKillerDesc"></small></span>
      </button>
      <button class="mode daily" data-go="#daily">
        <span class="mode-ico">📅</span>
        <span class="mode-txt"><b id="mDaily"></b><small id="mDailyDesc"></small></span>
        <span class="mode-tag" id="dailyTag"></span>
      </button>
    </div>

    <div class="ad-wrap" id="adHome"></div>

    <div class="card lb" id="lbCard">
      <h2 id="lbTitle"></h2>
      <div class="lb-body">
        <ol id="lbList"></ol>
        <button type="button" class="lb-lock" id="lbLock"></button>
      </div>
    </div>

    <div class="card getapp">
      <img src="img/icon.png" alt="" width="56" height="56">
      <div>
        <h2 id="getApp"></h2>
        <p id="getAppDesc"></p>
        <div class="stores">
          <a href="https://apps.apple.com/app/id6795192012" target="_blank" rel="noopener">App Store</a>
          <a href="https://play.google.com/store/apps/details?id=com.fabianmorar.hangman" target="_blank" rel="noopener">Google Play</a>
          <a href="/hangmania/" id="aboutLink" class="about"></a>
        </div>
      </div>
    </div>


    <footer class="foot">
      <a href="/">FB Center</a> · <a href="/hangman-privacy-policy/" id="fPrivacy"></a> · <a href="/hangman-privacy-policy/terms-of-service.html" id="fTerms"></a>
    </footer>
  </section>

  <!-- Difficulty -->
  <section id="diff" class="view" hidden>
    <button class="back" data-back>‹</button>
    <h1 class="diff-title" id="diffTitle"></h1>
    <p class="diff-sub" id="diffSub"></p>
    <div class="levels">
      <button class="level easy" data-level="Easy"><b></b><small></small></button>
      <button class="level medium" data-level="Medium"><b></b><small></small></button>
      <button class="level hard" data-level="Hard"><b></b><small></small></button>
      <button class="level expert" data-level="Expert"><b></b><small></small></button>
    </div>
  </section>

  <!-- Game -->
  <section id="game" class="view" hidden>
    <div class="g-top">
      <button class="back" data-back>‹</button>
      <span class="g-mode" id="gMode"></span>
    </div>
    <p class="save" id="gSave"></p>
    <div class="stats">
      <div class="stat"><small id="capScore"></small><b id="gScore">0</b></div>
      <div class="stat"><small id="capWrong"></small><b id="gWrong">0/6</b></div>
      <div class="stat" id="streakStat" hidden><small id="capStreak"></small><b id="gStreak">0</b></div>
    </div>
    <div class="stage">
      <div class="board" id="board"><img id="gImg" src="img/hangman0.png" alt=""></div>
      <div class="word" id="gWord"></div>
      <div class="guessed" id="gGuessed"></div>
      <div class="played" id="gPlayed" hidden></div>
    </div>
    <p class="type-hint" id="typeHint"></p>
    <div class="kb" id="kb"></div>
  </section>
</main>

<!-- Round result -->
<div class="overlay" id="result" hidden>
  <div class="dialog">
    <h2 id="rTitle"></h2>
    <p class="was" id="rWord"></p>
    <div class="badge" id="rScore"></div>
    <button class="btn gold" id="rAgain"></button>
    <button class="btn line" id="rHome"></button>
  </div>
</div>

<!-- Account -->
<div class="overlay" id="auth" hidden>
  <div class="dialog">
    <button class="x" id="authClose" aria-label="Close">×</button>
    <form id="fLogin" class="form">
      <h2 data-t="login"></h2>
      <input name="id" autocomplete="username" data-ph="emailOrUser">
      <input name="pw" type="password" autocomplete="current-password" data-ph="password">
      <p class="err" hidden></p>
      <button class="btn gold" type="submit" data-t="login"></button>
      <a href="#" class="swap" data-swap="fSignup" data-t="noAccount"></a>
      <p class="small" data-t="forgot"></p>
    </form>
    <form id="fSignup" class="form" hidden>
      <h2 data-t="signup"></h2>
      <input name="user" autocomplete="nickname" maxlength="20" data-ph="username">
      <input name="email" type="email" autocomplete="email" data-ph="email">
      <input name="pw" type="password" autocomplete="new-password" data-ph="password">
      <p class="err" hidden></p>
      <button class="btn gold" type="submit" data-t="signup"></button>
      <a href="#" class="swap" data-swap="fLogin" data-t="haveAccount"></a>
      <p class="small legal"><a href="/hangman-privacy-policy/terms-of-service.html" target="_blank" data-t="terms"></a> · <a href="/hangman-privacy-policy/" target="_blank" data-t="privacy"></a></p>
    </form>
    <form id="fCode" class="form" hidden>
      <h2 data-t="signup"></h2>
      <p class="small" id="codeSent"></p>
      <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-ph="code">
      <p class="err" hidden></p>
      <button class="btn gold" type="submit" data-t="verify"></button>
    </form>
    <div id="fMe" class="form" hidden>
      <h2 id="meName"></h2>
      <p class="small" id="meInfo"></p>
      <button class="btn line" id="logout" data-t="logout"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="i18n.js?v=4"></script>
<script src="daily.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
