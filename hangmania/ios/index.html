<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangmania — App Store</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/hangman-privacy-policy/email-assets/hangman-icon.png">
<script>
  // Opens the store app itself (itms-apps://) so the store's own web page never loads; anything
  // that can't handle that (a computer) gets the normal store page instead.
  (function () {
    var web = "https://apps.apple.com/app/id6795192012";
    var ua = navigator.userAgent || "";
    var phone = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (!phone) { location.replace(web); return; }
    location.href = "itms-apps://apps.apple.com/app/id6795192012";
    setTimeout(function () { if (!document.hidden) location.href = web; }, 1500);
  })();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: linear-gradient(180deg, #EAEFF9 0%, #E5EAF6 55%, #DCE4F5 100%); color: #0B2C6B; }
  .card { background: #fff; border: 1px solid #DDE3EC; border-radius: 24px; padding: 32px 28px; max-width: 360px; width: 100%;
          text-align: center; box-shadow: 0 8px 24px rgba(11,44,107,.15); }
  img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 6px 16px rgba(11,44,107,.25); }
  h1 { font-size: 26px; margin-top: 14px; }
  p { color: #5B6B8C; margin: 8px 0 20px; line-height: 1.45; }
  a { display: block; text-decoration: none; font-weight: 700; font-size: 17px; border-radius: 14px; padding: 14px;
       background: #0B2C6B; color: #fff; }
</style>
</head>
<body>
  <main class="card">
    <img src="/hangman-privacy-policy/email-assets/hangman-icon.png" alt="Hangmania">
    <h1>Hangmania</h1>
    <p>The classic word-guessing game, reinvented.<br>Free on iPhone.</p>
    <a href="https://apps.apple.com/app/id6795192012">Download on the App Store</a>
  </main>
</body>
</html>
